<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">GRPO: compare responses within the same task</title>
<desc id="desc">Original project schematic · conceptual flow, not a paper figure or measured result. Outcome and process supervision differ; project rewards and accounting remain separate choices.</desc>
