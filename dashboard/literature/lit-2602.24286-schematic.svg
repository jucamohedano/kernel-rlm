<text x="62" y="300" font-family="sans-serif" font-size="18" fill="#334155">AST-based overlap screening</text>
<text x="62" y="333" font-family="sans-serif" font-size="18" fill="#334155">Threshold 0.9 measures</text>
<text x="62" y="366" font-family="sans-serif" font-size="18" fill="#334155">structural overlap only.</text>
<text x="62" y="407" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e40af">Data separation ≠ semantic proof</text>
