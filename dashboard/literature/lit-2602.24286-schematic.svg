<text x="42" y="46" font-family="sans-serif" font-size="16" font-weight="700" fill="#475569">ORIGINAL PROJECT SCHEMATIC · NOT A PAPER FIGURE OR MEASURED RESULT</text>
<text x="42" y="92" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">CUDA Agent: data, tool feedback and staged RL</text>
<text x="42" y="125" font-family="sans-serif" font-size="18" fill="#475569">Three linked components; using Ops-6K alone is not a reproduction of the full method.</text>
