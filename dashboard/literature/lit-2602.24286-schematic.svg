<text x="447" y="300" font-family="sans-serif" font-size="18" fill="#334155">Profile execution</text>
<text x="447" y="333" font-family="sans-serif" font-size="18" fill="#334155">Staged actor / critic training</text>
<text x="447" y="366" font-family="sans-serif" font-size="18" fill="#334155">Tools provide feedback.</text>
<text x="447" y="407" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e40af">No PPO reproduction claim</text>
