<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc"><title id="title">Adapt a frozen model through a low-rank update</title><desc id="desc">Original project schematic · algebraic concept, not the paper’s artwork Frozen base W₀ stays fixed Pretrained weights. Trainable update ΔW = BA Low-rank A and B. Adapted operation h = W₀x + BAx Rank / placement vary. Attention-only rank 8 is project configuration, not a recipe established by this paper.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#365670"/></marker></defs><rect width="900" height="250" rx="14" fill="#f5f8fc"/><text x="25" y="33" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18354a">Adapt a frozen model through a low-rank update</text><text x="25" y="60" font-family="Arial,sans-serif" font-size="14" fill="#435d70">Original project schematic · algebraic concept, not the paper’s artwork</text><rect x="25.00" y="83" width="262.00" height="110" rx="10" fill="white" stroke="#94adbf"/><text x="156.00" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#18354a">Frozen base</text><text x="156.00" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#18354a">W₀ stays fixed</text><text x="156.00" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#18354a">Pretrained weights</text><path d="M291.00 138H313.00" stroke="#365670" stroke-width="2" marker-end="url(#arrow)"/><rect x="319.00" y="83" width="262.00" height="110" rx="10" fill="white" stroke="#94adbf"/><text x="450.00" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#18354a">Trainable update</text><text x="450.00" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#18354a">ΔW = BA</text><text x="450.00" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#18354a">Low-rank A and B</text><path d="M585.00 138H607.00" stroke="#365670" stroke-width="2" marker-end="url(#arrow)"/><rect x="613.00" y="83" width="262.00" height="110" rx="10" fill="white" stroke="#94adbf"/><text x="744.00" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#18354a">Adapted operation</text><text x="744.00" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#18354a">h = W₀x + BAx</text><text x="744.00" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#18354a">Rank / placement vary</text><text x="25" y="226" font-family="Arial,sans-serif" font-size="13" fill="#435d70">Attention-only rank 8 is project configuration, not a recipe established by this paper.</text></svg>
