<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">DAPO: token weighting and group selection are separate</title>
<desc id="desc">Original project schematic · conceptual flow, not a paper figure or measured result. Deferring a weak mixed group is not zero-gradient filtering; CUDA budgets need their own objective.</desc>
<rect width="1200" height="400" rx="18" fill="#0f172a"/>
<text x="35" y="48" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#f8fafc">DAPO: token weighting and group selection are separate</text>
<text x="35" y="82" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">Original project schematic · conceptual flow, not a paper figure or measured result</text>
<rect x="35" y="130" width="245" height="140" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="51" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#7dd3fc">Sample groups</text>
<text x="51" y="215" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">Inspect correctness</text>
<text x="51" y="238" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">variation</text>
<path d="M 289 200 h 30 m -9 -7 l 9 7 -9 7" stroke="#94a3b8" fill="none" stroke-width="3"/>
<rect x="330" y="130" width="245" height="140" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="346" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#7dd3fc">Dynamic sampling</text>
<text x="346" y="215" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">Exclude all-zero / all-</text>
<text x="346" y="238" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">one groups</text>
<path d="M 584 200 h 30 m -9 -7 l 9 7 -9 7" stroke="#94a3b8" fill="none" stroke-width="3"/>
<rect x="625" y="130" width="245" height="140" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="641" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#7dd3fc">Token-level loss</text>
<text x="641" y="215" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">Use realized group token</text>
<text x="641" y="238" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">count</text>
<path d="M 879 200 h 30 m -9 -7 l 9 7 -9 7" stroke="#94a3b8" fill="none" stroke-width="3"/>
<rect x="920" y="130" width="245" height="140" rx="12" fill="#1e293b" stroke="#38bdf8"/>
<text x="936" y="165" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#7dd3fc">Long outputs</text>
<text x="936" y="215" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">Masking and soft</text>
<text x="936" y="238" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1">punishment differ</text>
<text x="35" y="325" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#e2e8f0">Deferring a weak mixed group is not zero-gradient filtering; CUDA budgets need their own objective.</text>
</svg>
