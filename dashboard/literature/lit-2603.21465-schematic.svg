<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">DRTriton: composition-controlled data and curriculum</title><desc id="desc">Original project schematic of composition-controlled synthetic data, held-out curriculum progression and separate evaluation/search in DRTriton. No paper artwork or quantitative result reproduced.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#52627a"/></marker></defs>
<rect width="1200" height="620" rx="20" fill="#f8fafc"/>
<text x="42" y="46" font-family="sans-serif" font-size="16" font-weight="700" fill="#475569">ORIGINAL PROJECT SCHEMATIC · NOT A PAPER FIGURE OR MEASURED RESULT</text>
<text x="42" y="92" font-family="sans-serif" font-size="29" font-weight="700" fill="#0f172a">DRTriton: composition-controlled data and curriculum</text>
<text x="42" y="125" font-family="sans-serif" font-size="18" fill="#475569">Training progression and test-time composition search are separate mechanisms.</text>
<rect x="42" y="170" width="350" height="265" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="42" y="170" width="350" height="58" rx="14" fill="#dbeafe"/>
<text x="62" y="207" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">Generate programs</text>
<text x="62" y="267" font-family="sans-serif" font-size="18" fill="#334155">CSP-DAG controls synthetic</text>
<text x="62" y="300" font-family="sans-serif" font-size="18" fill="#334155">operator compositions and</text>
<text x="62" y="333" font-family="sans-serif" font-size="18" fill="#334155">difficulty. The method uses</text>
<text x="62" y="366" font-family="sans-serif" font-size="18" fill="#334155">an SFT warm start.</text>
<text x="62" y="407" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e40af">Control the training distribution</text>
<path d="M396,302 H422" stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="427" y="170" width="350" height="265" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="427" y="170" width="350" height="58" rx="14" fill="#dcfce7"/>
<text x="447" y="207" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">Advance curriculum</text>
<text x="447" y="267" font-family="sans-serif" font-size="18" fill="#334155">Evaluate current-level</text>
<text x="447" y="300" font-family="sans-serif" font-size="18" fill="#334155">held-out Pass@1.</text>
<text x="447" y="333" font-family="sans-serif" font-size="18" fill="#334155">Advance when it exceeds</text>
<text x="447" y="366" font-family="sans-serif" font-size="18" fill="#334155">the curriculum threshold.</text>
<text x="447" y="407" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e40af">Easy-first groups ≠ transfer</text>
<path d="M781,302 H807" stroke="#52627a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="812" y="170" width="350" height="265" rx="14" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<rect x="812" y="170" width="350" height="58" rx="14" fill="#fef3c7"/>
<text x="832" y="207" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">Evaluate and search</text>
<text x="832" y="267" font-family="sans-serif" font-size="18" fill="#334155">Separate 400-program</text>
<text x="832" y="300" font-family="sans-serif" font-size="18" fill="#334155">synthetic evaluation and</text>
<text x="832" y="333" font-family="sans-serif" font-size="18" fill="#334155">KernelBench evaluation.</text>
<text x="832" y="366" font-family="sans-serif" font-size="18" fill="#334155">Composition search is extra.</text>
<text x="832" y="407" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e40af">Separate train and search effects</text>
<rect x="42" y="467" width="1120" height="112" rx="12" fill="#e2e8f0"/>
<text x="62" y="500" font-family="sans-serif" font-size="18" fill="#0f172a">Project connection: a curriculum / data-design influence, not an implemented CSP-DAG pipeline.</text>
<text x="62" y="529" font-family="sans-serif" font-size="18" fill="#0f172a">Triton, synthetic programs and eight H100s differ from this project’s direct CUDA / RTX setup.</text>
</svg>
