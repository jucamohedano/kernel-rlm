[project]
name = "cute-rlm"
version = "0.1.0"
description = "CPU-first CuTe task and documentation preparation"
requires-python = ">=3.11"
dependencies = ["pyarrow>=18", "numpy>=1.26", "httpx>=0.28", "aiohttp>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cute_rlm"]
