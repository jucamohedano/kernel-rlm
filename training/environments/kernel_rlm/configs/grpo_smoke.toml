# Bounded live GRPO run: one inference GPU + two trainer GPUs.
# The workload is intentionally larger than the one-step wiring gate.

max_steps = 3
seq_len = 8192
output_dir = "/traces/outputs"

[deployment]
num_train_gpus = 2
num_infer_gpus = 1

[model]
name = "poolside/Laguna-XS.2"

[monitors.file]
path = "metrics.jsonl"

[monitors.wandb]
project = "laguna-kernel-rlm"

[trainer.model]
impl = "custom"
ep = 2
fused_lm_head_token_chunk_size = 1024

[trainer.model.ac_offloading]
max_inflight_activations = 1

[trainer.model.lora]
rank = 8
alpha = 16
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj"]

[trainer.optim]
type = "muon"
lr = 1e-5
weight_decay = 0.01
mu = 0.95

[orchestrator]
batch_size = 8
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 1024

[[orchestrator.train.source]]
name = "kernel-rlm"
env.taskset.id = "kernel_rlm_v1"
env.taskset.manifest_path = "/root/kernel_rlm/tasks/vector_add.jsonl"
env.agent.harness.id = "kernel_rlm_v1"
env.agent.harness.max_turns = 5
env.agent.harness.max_tokens = 1024
env.agent.runtime.type = "subprocess"

[orchestrator.model.lora]
rank = 8
alpha = 16

[orchestrator.renderer]
name = "laguna-xs.2"

[inference.vllm]
enable_lora = true
gpu_memory_utilization = 0.95
max_model_len = 8192
