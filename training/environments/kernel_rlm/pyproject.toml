[project]
name = "kernel-rlm"
version = "0.0.1"
description = "CUDA kernel tasks trained through the local RLM loop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rlm-train",
    "verifiers>=0.1.11",
    "datasets>=4.0",
]

[project.optional-dependencies]
cuda = ["torch>=2.0"]

[tool.uv.sources]
rlm-train = { path = "../..", editable = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kernel_rlm"]

[project.entry-points."verifiers.environments"]
kernel-rlm = "kernel_rlm:load_environment"
