name: Style

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.9"

      - name: Install locked quality tools
        run: uv sync --locked --group dev --no-default-groups

      - name: Run read-only local checks
        run: |
          uv run --no-sync make lint format-check
          uv run --no-sync ty check --exit-zero --output-format=concise

      - name: Check changed files with pre-commit
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --no-sync pre-commit run --from-ref "$BASE_REF" --to-ref "${GITHUB_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check dashboard JavaScript
        run: make test-dashboard
